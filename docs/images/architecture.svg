<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 748" width="1060" height="748" role="img" aria-labelledby="t d">
  <title id="t">Rhumb system architecture</title>
  <desc id="d">A Tauri desktop client on your laptop reaches two hosts on your Proxmox box over a Tailscale mesh. The React webview never talks to the hosts directly; a Rust proxy does, because it can set the control header browser JavaScript cannot. On the box, the agent host runs the Claude Code session and calls the Anthropic API — the only data that leaves the box. Every write and infrastructure action from either host parks in an approval queue and reaches Postgres or an LXC container only after the operator approves it in the client transcript. Both hosts are joined by a shared workspace folder the agent writes surfaces into and the dashboard host serves from.</desc>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ba2ac"/>
    </marker>
    <marker id="arwA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff5a1f"/>
    </marker>
    <marker id="arwF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a828d"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1060" height="748" fill="#0a0b0d"/>

  <text x="40" y="42" fill="#f4f5f7" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17">Rhumb — how work moves through the system</text>
  <text x="40" y="64" fill="#7a828d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5">The client is a window. State, workspace, and your Claude credentials stay on your box.</text>

  <!-- Tailnet boundary -->
  <line x1="292" y1="92" x2="292" y2="706" stroke="#2a2f36" stroke-width="1" stroke-dasharray="4 6"/>
  <text transform="rotate(-90 284 570)" x="284" y="570" fill="#7a828d" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.6">TAILSCALE MESH</text>

  <!-- Laptop -->
  <text x="40" y="104" fill="#7a828d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.4">YOUR LAPTOP</text>
  <rect x="40" y="116" width="212" height="248" rx="6" fill="#111316" stroke="#2a2f36"/>

  <rect x="58" y="138" width="176" height="82" rx="4" fill="#16191d" stroke="#1f2328"/>
  <text x="146" y="166" fill="#f4f5f7" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13.5">React webview</text>
  <text x="146" y="188" fill="#9ba2ac" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11">transcript · canvas · MAP</text>
  <text x="146" y="206" fill="#7a828d" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11">reaches no host itself</text>

  <line x1="146" y1="220" x2="146" y2="252" stroke="#ff5a1f" stroke-width="1.4" marker-end="url(#arwA)"/>
  <text x="156" y="242" fill="#ff5a1f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">invoke()</text>

  <rect x="58" y="256" width="176" height="86" rx="4" fill="#16191d" stroke="#1f2328"/>
  <text x="146" y="284" fill="#f4f5f7" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13.5">Rust proxy</text>
  <text x="146" y="306" fill="#9ba2ac" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11">sets Sec-Rhumb-Control</text>
  <text x="146" y="324" fill="#7a828d" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11">browser JS cannot</text>

  <!-- Box -->
  <text x="330" y="104" fill="#7a828d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.4">PROXMOX BOX — YOURS</text>
  <rect x="330" y="116" width="700" height="590" rx="6" fill="#111316" stroke="#2a2f36"/>

  <!-- Anthropic -->
  <rect x="700" y="48" width="300" height="64" rx="4" fill="#16191d" stroke="#2a2f36"/>
  <text x="850" y="76" fill="#f4f5f7" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13.5">Anthropic API</text>
  <text x="850" y="97" fill="#7a828d" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11">or the compatible gateway you configure</text>

  <polyline points="501,152 501,80 694,80" fill="none" stroke="#9ba2ac" stroke-width="1.2" marker-end="url(#arw)" marker-start="url(#arw)"/>
  <rect x="556" y="60" width="92" height="16" fill="#0a0b0d"/>
  <text x="602" y="73" fill="#9ba2ac" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Messages API</text>
  <text x="512" y="138" fill="#7a828d" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11">the only data that leaves the box</text>

  <!-- agent-host -->
  <rect x="356" y="152" width="290" height="152" rx="4" fill="#16191d" stroke="#1f2328"/>
  <text x="501" y="182" fill="#f4f5f7" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="14.5">agent-host</text>
  <text x="501" y="208" fill="#9ba2ac" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5">Claude Code SDK session</text>
  <text x="501" y="230" fill="#9ba2ac" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5">infra capability · Proxmox, DB</text>
  <text x="501" y="252" fill="#9ba2ac" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5">ontology graph</text>
  <text x="501" y="280" fill="#7a828d" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11">owns the workspace</text>

  <!-- dashboard-host -->
  <rect x="356" y="342" width="290" height="152" rx="4" fill="#16191d" stroke="#1f2328"/>
  <text x="501" y="372" fill="#f4f5f7" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="14.5">dashboard-host</text>
  <text x="501" y="398" fill="#9ba2ac" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5">surface registry</text>
  <text x="501" y="420" fill="#9ba2ac" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5">serves agent-built surfaces</text>
  <text x="501" y="442" fill="#9ba2ac" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5">data endpoint · read/write</text>
  <text x="501" y="470" fill="#7a828d" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11">reverse-proxies spawned services</text>

  <!-- client to hosts -->
  <line x1="234" y1="286" x2="350" y2="248" stroke="#9ba2ac" stroke-width="1.2" marker-end="url(#arw)"/>
  <rect x="252" y="248" width="80" height="15" fill="#0a0b0d"/>
  <text x="292" y="260" fill="#9ba2ac" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">turns · SSE</text>

  <line x1="234" y1="314" x2="350" y2="388" stroke="#9ba2ac" stroke-width="1.2" marker-end="url(#arw)"/>
  <rect x="248" y="360" width="90" height="15" fill="#0a0b0d"/>
  <text x="292" y="372" fill="#9ba2ac" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">surfaces · SSE</text>

  <!-- approval queue -->
  <rect x="690" y="152" width="54" height="342" rx="4" fill="#16191d" stroke="#ff5a1f" stroke-width="1.5"/>
  <text transform="rotate(-90 717 323)" x="717" y="323" fill="#ff5a1f" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1.4">APPROVAL QUEUE</text>

  <!-- resources -->
  <rect x="796" y="152" width="218" height="152" rx="4" fill="#16191d" stroke="#1f2328"/>
  <text x="905" y="188" fill="#f4f5f7" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13.5">LXC containers</text>
  <text x="905" y="214" fill="#9ba2ac" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5">spawned services</text>
  <text x="905" y="236" fill="#9ba2ac" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5">blue-green redeploy</text>

  <rect x="796" y="342" width="218" height="152" rx="4" fill="#16191d" stroke="#1f2328"/>
  <text x="905" y="378" fill="#f4f5f7" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13.5">Postgres</text>
  <text x="905" y="404" fill="#9ba2ac" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5">provisioned per tool</text>
  <text x="905" y="426" fill="#9ba2ac" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5">rows the surfaces read</text>

  <!-- gate arrows -->
  <line x1="646" y1="218" x2="686" y2="218" stroke="#ff5a1f" stroke-width="1.4" marker-end="url(#arwA)"/>
  <text x="666" y="208" fill="#ff5a1f" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">gated</text>
  <line x1="744" y1="218" x2="792" y2="218" stroke="#ff5a1f" stroke-width="1.4" marker-end="url(#arwA)"/>
  <text x="768" y="208" fill="#ff5a1f" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">executes</text>

  <line x1="646" y1="408" x2="686" y2="408" stroke="#ff5a1f" stroke-width="1.4" marker-end="url(#arwA)"/>
  <text x="666" y="398" fill="#ff5a1f" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">gated</text>
  <line x1="744" y1="408" x2="792" y2="408" stroke="#ff5a1f" stroke-width="1.4" marker-end="url(#arwA)"/>
  <text x="768" y="398" fill="#ff5a1f" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">executes</text>

  <!-- workspace -->
  <rect x="356" y="566" width="324" height="80" rx="4" fill="#16191d" stroke="#1f2328"/>
  <text x="518" y="594" fill="#f4f5f7" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">RHUMB_WORKSPACE</text>
  <text x="518" y="616" fill="#7a828d" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11">file-as-contract — the agent writes</text>
  <text x="518" y="632" fill="#7a828d" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11">surfaces here, the dashboard host serves them</text>

  <polyline points="646,276 664,276 664,562" fill="none" stroke="#7a828d" stroke-width="1.2" marker-end="url(#arwF)"/>
  <text x="628" y="548" fill="#7a828d" text-anchor="end" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11">writes surfaces</text>

  <line x1="470" y1="562" x2="470" y2="498" stroke="#7a828d" stroke-width="1.2" marker-end="url(#arwF)"/>
  <text x="480" y="528" fill="#7a828d" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11">watches · serves</text>

  <!-- approval returns to the operator -->
  <polyline points="717,494 717,672 146,672 146,368" fill="none" stroke="#ff5a1f" stroke-width="1.4" marker-end="url(#arwA)"/>
  <text x="438" y="663" fill="#ff5a1f" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11">each parked action becomes an approval card in the transcript</text>

  <line x1="40" y1="730" x2="64" y2="730" stroke="#ff5a1f" stroke-width="1.4"/>
  <text x="72" y="734" fill="#7a828d" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11">orange marks the gate: nothing writes rows or touches infrastructure until you approve it</text>
</svg>
